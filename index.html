<!DOCTYPE html>
<html lang="es" class="dark">
    <head>
        <!-- Script para prevenir flash de tema incorrecto (usa la misma key que HeroUI) -->
        <script>
            (function() {
                const theme = localStorage.getItem('theme') || 'dark';
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            })();
        </script>

        <!-- Metadatos esenciales -->
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- Title y descripción base (serán sobrescritos por react-helmet-async) -->
        <title>Alexander Gavilán | Software Developer</title>
        <meta
            name="description"
            content="Desarrollador Full Stack especializado en React, Node.js y diseño web. Licenciado en Diseño Tecnológico con experiencia en soluciones tecnológicas innovadoras."
        />

        <!-- Favicon y iconos -->
        <link rel="icon" type="image/x-icon" href="/icon.ico" />
        <link rel="apple-touch-icon" href="/icon.ico" />

        <!-- Theme preference -->
        <meta name="color-scheme" content="dark light" />
        <meta name="msapplication-TileColor" content="#2f3238" />

        <!-- Información del autor -->
        <meta name="author" content="Jeisson Alexander Gavilán Murcia" />
        <meta name="copyright" content="© 2022-2026 Jeisson Alexander Gavilán Murcia" />

        <!-- Geo localización -->
        <meta name="geo.region" content="CO-CUN" />
        <meta name="geo.placename" content="Bogotá" />
        <meta name="geo.position" content="4.60971;-74.08175" />
        <meta name="ICBM" content="4.60971, -74.08175" />

        <!-- Preferencias de indexación y renderizado -->
        <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
        <meta name="googlebot" content="index, follow" />
        <meta name="bingbot" content="index, follow" />

        <!-- DNS Prefetch para mejorar performance -->
        <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
        <link rel="dns-prefetch" href="https://unpkg.com" />

        <!-- Preconnect para recursos críticos -->
        <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
        <link rel="preconnect" href="https://unpkg.com" crossorigin />

        <!-- Security Headers -->
        <meta http-equiv="X-Content-Type-Options" content="nosniff" />
        <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
        <meta name="referrer" content="strict-origin-when-cross-origin" />
    </head>
    <body class="text-foreground bg-background">
        <noscript>Necesitas tener activado el uso de JavaScrip para esta aplicación.</noscript>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>

        <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js" defer></script>
        <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js" defer></script>
    </body>
</html>
